name: Dependency Vulnerability Scan

on:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # Run every Monday at 06:00 UTC so new CVEs are caught even without a code push
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Minimal permissions: this workflow reads code and uploads an artifact.
# It does not write to the repo, create PRs, or call GitHub APIs.
permissions:
  contents: read

# Cancel redundant scan runs on the same branch/PR.
# Scheduled runs are never cancelled (ref = 'refs/heads/main' on schedule).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15   # audit + install; protects against npm registry hangs

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Retry up to 3 times — npm ci fails transiently on mirror/network timeouts
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed — retrying in 15s..." && sleep 15
          done

      # ── Full report (informational, never fails the job) ──────────────────
      # Captures the complete audit output including high/moderate/low findings
      # that are pre-existing Angular 14 debt. Uploaded as an artifact so
      # reviewers can inspect without scrolling raw logs.
      - name: Generate full audit report
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      # ── Summary table printed to the Actions job log ──────────────────────
      - name: Print vulnerability summary
        continue-on-error: true   # advisory — summary failure must not block the audit gate
        run: |
          echo "### Vulnerability summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node - << 'JS'
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            const v = report.metadata?.vulnerabilities ?? {};
            const rows = ['critical','high','moderate','low','info']
              .map(s => `| ${s} | ${v[s] ?? 0} |`).join('\n');
            const summary =
              `| Severity | Count |\n|---|---|\n${rows}\n\n` +
              `**Total packages scanned:** ${report.metadata?.totalDependencies ?? 'n/a'}`;
            console.log(summary);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          JS

      # ── Hard gate: fails only on critical vulns NOT in the allowlist ─────
      # GHSA-67hx-6x53-jw92 (@babel/traverse) is allowlisted — pre-existing
      # Angular 14 transitive dep. See audit-ci.json for full rationale.
      - name: Fail on unlisted critical vulnerabilities
        run: npx audit-ci --config audit-ci.json
