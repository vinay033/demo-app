name: Contract Tests

on:
  push:
    paths:
      - "src/**"
      - "projects/**"
      - "angular.json"
      - "karma.conf.js"
      - "scripts/karma.base.js"
      - "tsconfig*.json"
      - ".github/workflows/contract-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "projects/**"
      - "angular.json"
      - "karma.conf.js"
      - "scripts/karma.base.js"
      - "tsconfig*.json"
      - ".github/workflows/contract-tests.yml"

# Minimal permissions: test runs are read-only. No repo writes needed.
permissions:
  contents: read

# Cancel redundant runs on the same branch/PR to save runner minutes.
# Never cancel on main — every green commit there is a permanent record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract-tests:
    name: Contract & unit tests (${{ matrix.project.name }} / flags-${{ matrix.flag_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Chrome launch hangs are the most common cause of stuck jobs

    strategy:
      fail-fast: false   # run all projects even if one fails
      matrix:
        project:
          - name: demo-app
            ng_target: ""          # default project, no --project flag needed
          - name: sub-app1
            ng_target: "sub-app1"
          - name: sub-app2
            ng_target: "sub-app2"
        flag_mode:
          - on    # environment.ts        — all flags true  (dev default)
          - off   # environment.flags-off.ts — all flags false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        # Retry up to 3 times — npm ci fails transiently on mirror/network timeouts
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed — retrying in 15s..." && sleep 15
          done

      - name: Install Chrome system libraries (required by karma-chrome-launcher)
        # RELIABILITY: ubuntu-latest runners ship with google-chrome-stable pre-installed.
        # Skip apt-get entirely when Chrome is already on PATH — saves ~25 s per matrix cell
        # (6 cells × 25 s = ~2.5 min) and eliminates apt-get 503 mirror failures.
        # apt-get is retained as a fallback for self-hosted or custom runner images.
        run: |
          if command -v google-chrome-stable &>/dev/null; then
            echo "✅ google-chrome-stable already present at $(which google-chrome-stable) — skipping apt-get"
          elif command -v chromium-browser &>/dev/null || command -v chromium &>/dev/null; then
            echo "✅ chromium already present — skipping apt-get"
          else
            echo "⚠️  Chrome not found — installing via apt-get (fallback for custom runners)"
            for attempt in 1 2; do
              sudo apt-get update -qq && \
              sudo apt-get install -y --no-install-recommends \
                google-chrome-stable \
                libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
                libxfixes3 libxrandr2 libgbm1 libasound2t64 \
                libxshmfence1 libglu1-mesa && break || \
              sudo apt-get install -y --no-install-recommends \
                chromium-browser \
                libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
                libxfixes3 libxrandr2 libgbm1 libasound2t64 && break
              [ $attempt -lt 2 ] && echo "Chrome install attempt $attempt failed — retrying in 10s..." && sleep 10
            done
          fi

      - name: Detect Chrome binary path
        # Exports CHROME_BIN so the Karma step picks up whichever binary was installed
        run: |
          CHROME_BIN=$(which google-chrome-stable 2>/dev/null \
            || which chromium-browser 2>/dev/null \
            || which chromium 2>/dev/null \
            || echo "")
          if [ -z "$CHROME_BIN" ]; then
            echo "❌ No Chrome/Chromium binary found — test run will fail" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Detected Chrome binary: $CHROME_BIN"

      - name: TypeScript type-check (${{ matrix.project.name }})
        run: |
          if [ "${{ matrix.project.name }}" = "demo-app" ]; then
            npx tsc --noEmit -p tsconfig.app.json
          else
            npx tsc --noEmit -p projects/${{ matrix.project.name }}/tsconfig.app.json
          fi

      - name: Run tests with coverage (${{ matrix.project.name }} / flags-${{ matrix.flag_mode }})
        id: run-tests
        run: |
          # Build the --configuration flag: 'on' means no override (dev default),
          # 'off' means --configuration=flags-off (environment.flags-off.ts).
          if [ "${{ matrix.flag_mode }}" = "off" ]; then
            CONFIG_FLAG="--configuration=flags-off"
          else
            CONFIG_FLAG=""
          fi

          # RELIABILITY: wrap ng test with timeout --kill-after=30 600 (10 min SIGTERM, +30s SIGKILL).
          # Chrome/Karma hangs are rare but will pin a runner for the full 20-min job timeout
          # without this guard.  Fail-fast at 10 min frees the slot and surfaces the hang clearly.
          # Normal test runs complete in under 2 min; the 10-min limit is conservative.
          if [ -z "${{ matrix.project.ng_target }}" ]; then
            timeout --kill-after=30 600 npx ng test --no-watch --browsers=ChromeHeadlessCI $CONFIG_FLAG 2>&1 | tee test-output.txt
          else
            timeout --kill-after=30 600 npx ng test ${{ matrix.project.ng_target }} --no-watch --browsers=ChromeHeadlessCI $CONFIG_FLAG 2>&1 | tee test-output.txt
          fi
          # CHROME_BIN is exported by the 'Detect Chrome binary path' step via $GITHUB_ENV

      - name: Write per-project coverage to job summary
        if: always()
        continue-on-error: true   # advisory — summary failure must not fail the test job
        run: |
          node - << 'JS'
            const fs      = require('fs');
            const project  = '${{ matrix.project.name }}';
            const flagMode = '${{ matrix.flag_mode }}';
            const jsonPath = `coverage/${project}/coverage-summary.json`;

            // ── parse coverage-summary.json if present ─────────────────────
            let rows = '';
            let overallIcon = '✅';
            if (fs.existsSync(jsonPath)) {
              const { total: t } = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              const badge = pct => pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
              rows = [
                `| Statements | ${t.statements.pct}% | ${t.statements.covered} / ${t.statements.total} | ${badge(t.statements.pct)} |`,
                `| Branches   | ${t.branches.pct}%   | ${t.branches.covered}   / ${t.branches.total}   | ${badge(t.branches.pct)}   |`,
                `| Functions  | ${t.functions.pct}%  | ${t.functions.covered}  / ${t.functions.total}  | ${badge(t.functions.pct)}  |`,
                `| Lines      | ${t.lines.pct}%      | ${t.lines.covered}      / ${t.lines.total}      | ${badge(t.lines.pct)}      |`,
              ].join('\n');
              if ([t.statements.pct, t.branches.pct, t.functions.pct, t.lines.pct].some(p => p < 60))
                overallIcon = '❌';
            } else {
              rows = '| (no coverage-summary.json found) | — | — | ❓ |';
              overallIcon = '❓';
            }

            // ── parse spec count from test output ─────────────────────────
            const output  = fs.existsSync('test-output.txt')
              ? fs.readFileSync('test-output.txt', 'utf8') : '';
            const match   = output.match(/Executed (\d+) of (\d+)/g);
            const lastRun = match ? match[match.length - 1] : 'unknown';
            const passed  = !output.includes('FAILED');

            const summary = [
              `## ${overallIcon} Coverage — ${project} (flags-${flagMode})`,
              '',
              `**Specs:** ${lastRun}  ·  ${passed ? '✅ All passed' : '❌ Failures detected'}`,
              '',
              '| Metric | Coverage | Covered / Total | Threshold |',
              '|---|---|---|---|',
              rows,
              '',
              '<details><summary>Full test output</summary>',
              '',
              '```',
              output.slice(-4000).trim(),
              '```',
              '</details>',
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            console.log(`Coverage summary written for ${project}`);
          JS

      - name: Upload coverage report (${{ matrix.project.name }} flags-${{ matrix.flag_mode }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.project.name }}-flags-${{ matrix.flag_mode }}
          path: coverage/${{ matrix.project.name }}/
          retention-days: 14

  contract-tests-summary:
    name: All contract tests passed
    runs-on: ubuntu-latest
    needs: contract-tests
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.contract-tests.result }}" != "success" ]; then
            echo "One or more contract test jobs failed."
            exit 1
          fi
          echo "All contract test jobs passed."

      - name: Post test summary
        if: always()
        continue-on-error: true   # advisory — summary failure must not fail the gate job
        run: |
          RESULT="${{ needs.contract-tests.result }}"
          ICON="✅"
          [ "$RESULT" != "success" ] && ICON="❌"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${ICON} Contract & unit tests — matrix summary

          | Project | Flag mode | Specs | Result |
          |---|---|---|---|
          | demo-app  | flags-on  | 67 | ${RESULT} |
          | demo-app  | flags-off | 67 | ${RESULT} |
          | sub-app1  | flags-on  | 8  | ${RESULT} |
          | sub-app1  | flags-off | 8  | ${RESULT} |
          | sub-app2  | flags-on  | 3  | ${RESULT} |
          | sub-app2  | flags-off | 3  | ${RESULT} |

          **Total: 6 matrix cells (3 projects × 2 flag modes)**
          Each flag mode validates ON-path and OFF-path guard behaviour independently.

          > Coverage reports: download the \`coverage-<project>-flags-<mode>\` artifacts.
          EOF

  # ── Coverage PR comment ────────────────────────────────────────────────────
  # Runs only on pull_request events.  Downloads the three coverage-summary.json
  # artifacts, builds a consolidated Markdown table, and creates or updates a
  # single PR comment (idempotent — keyed on the <!-- coverage-report --> marker).
  # continue-on-error: true so a gh CLI hiccup never blocks the merge.
  coverage-comment:
    name: Post coverage to PR
    runs-on: ubuntu-latest
    needs: contract-tests
    if: always() && github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      pull-requests: write  # needed to create/edit PR comments

    steps:
      - name: Download flags-on coverage artifacts (used for PR comment)
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-flags-on
          path: coverage-artifacts/

      - name: Build and post coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MATRIX_RESULT: ${{ needs.contract-tests.result }}
        run: |
          node - << 'JS'
            const fs   = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const projects = ['demo-app', 'sub-app1', 'sub-app2'];
            const specCounts = { 'demo-app': 67, 'sub-app1': 8, 'sub-app2': 3 };

            // ── parse each project's coverage-summary.json ─────────────────
            function parseCoverage(project) {
              // Artifacts are named coverage-<project>-flags-on
              const p = `coverage-artifacts/coverage-${project}-flags-on/coverage-summary.json`;
              if (!fs.existsSync(p)) return null;
              return JSON.parse(fs.readFileSync(p, 'utf8')).total;
            }

            function badge(pct) {
              if (pct === undefined || pct === null) return '❓';
              return pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
            }

            function fmtPct(pct) {
              if (pct === undefined) return '—';
              return pct + '%';
            }

            const rows = projects.map(proj => {
              const t = parseCoverage(proj);
              if (!t) return `| **${proj}** | ${specCounts[proj]} | — | — | — | — | ❓ |`;
              return [
                `| **${proj}** | ${specCounts[proj]}`,
                `${badge(t.statements.pct)} ${fmtPct(t.statements.pct)}`,
                `${badge(t.branches.pct)} ${fmtPct(t.branches.pct)}`,
                `${badge(t.functions.pct)} ${fmtPct(t.functions.pct)}`,
                `${badge(t.lines.pct)} ${fmtPct(t.lines.pct)}`,
                `${t.lines.covered}/${t.lines.total} |`,
              ].join(' | ');
            });

            const result   = process.env.MATRIX_RESULT;
            const topIcon  = result === 'success' ? '✅' : '❌';
            const runUrl   = `https://github.com/${process.env.REPO}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sha7     = (process.env.GITHUB_SHA || 'unknown').slice(0, 7);
            const now      = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';

            const body = [
              '<!-- coverage-report -->',
              `## ${topIcon} Coverage report — \`${sha7}\``,
              '',
              `> ${now} · [View full run](${runUrl})`,
              '',
              '| Project | Specs | Statements | Branches | Functions | Lines | Covered |',
              '|---|---|---|---|---|---|---|',
              ...rows,
              '',
              '🟢 ≥ 80%  🟡 60–79%  🔴 < 60%',
              '',
              '<details>',
              '<summary>How to view detailed coverage</summary>',
              '',
              '1. Download the `coverage-<project>` artifacts from this run',
              '2. Open `index.html` in a browser for the full Istanbul HTML report',
              '3. `lcov.info` can be imported into VS Code Coverage Gutters extension',
              '',
              '</details>',
            ].join('\n');

            // ── post or update the PR comment (idempotent) ─────────────────
            const repo      = process.env.REPO;
            const prNumber  = process.env.PR_NUMBER;
            const marker    = '<!-- coverage-report -->';
            const token     = process.env.GH_TOKEN;

            // List existing comments
            const listCmd = `gh api repos/${repo}/issues/${prNumber}/comments --jq '[.[] | {id: .id, body: .body[0:60]}]'`;
            let comments = [];
            try {
              comments = JSON.parse(execSync(listCmd, { env: { ...process.env, GH_TOKEN: token } }).toString());
            } catch(e) {
              console.error('Could not list comments:', e.message);
            }

            const existing = comments.find(c => c.body.includes(marker.slice(0, 20)));

            fs.writeFileSync('coverage-comment.md', body);

            if (existing) {
              execSync(
                `gh api repos/${repo}/issues/comments/${existing.id} -X PATCH -f body=@coverage-comment.md`,
                { env: { ...process.env, GH_TOKEN: token }, stdio: 'inherit' }
              );
              console.log('Updated existing coverage comment id', existing.id);
            } else {
              execSync(
                `gh api repos/${repo}/issues/${prNumber}/comments -f body=@coverage-comment.md`,
                { env: { ...process.env, GH_TOKEN: token }, stdio: 'inherit' }
              );
              console.log('Created new coverage comment on PR', prNumber);
            }

            // Also write to step summary
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body.replace('<!-- coverage-report -->\n', '') + '\n');
          JS

  # ── Non-blocking telemetry evidence job ────────────────────────────────────
  # Runs in parallel with the test matrix (no `needs:`), so it adds zero
  # wall-clock time to the critical path.  continue-on-error: true means a
  # script failure never blocks a merge — this is purely informational evidence.
  telemetry-evidence:
    name: Telemetry instrumentation evidence
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking: failure never gates merge
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install production + dev dependencies
        # Retry up to 3 times — npm ci fails transiently on mirror/network timeouts
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed — retrying in 15s..." && sleep 15
          done

      - name: Run telemetry verification script
        id: verify
        run: |
          node scripts/verify-telemetry.mjs 2>&1 | tee telemetry-evidence.txt || true

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetry-evidence
          path: telemetry-evidence.txt
          retention-days: 14

      - name: Post telemetry summary to job summary
        if: always()
        run: |
          node - << 'JS'
            const fs  = require('fs');
            const raw = fs.existsSync('telemetry-evidence.txt')
              ? fs.readFileSync('telemetry-evidence.txt', 'utf8').replace(/\x1b\[[0-9;]*m/g, '')
              : '(no output — script may have failed)';

            // Extract the 14 meaningful [telemetry] lines (skip stress-test noise)
            const meaningful = raw.split('\n')
              .filter(l => l.startsWith('[telemetry]') && !l.includes('stress.test'))
              .map(l => `\`${l.trim()}\``)
              .join('\n');

            // Extract Performance API summary line
            const marksLine   = raw.match(/marks:\s+(\d+)/)?.[0]  ?? 'marks: n/a';
            const measuresLine = raw.match(/measures:\s+(\d+)/)?.[0] ?? 'measures: n/a';

            // Ring-buffer result
            const bufLine = raw.match(/buffer holds \d+ \(\d+ oldest dropped\)/)?.[0] ?? '';

            // Flush result
            const flushOk = raw.includes('buffer cleared ✔');

            const summary = [
              '## 📡 Telemetry instrumentation evidence',
              '',
              '> **Non-blocking job** — this evidence does not gate merge.',
              '> Full guide: [`docs/telemetry.md`](./docs/telemetry.md)',
              '',
              '### Instrumentation points verified',
              '',
              '| Point | Metric | Status |',
              '|---|---|---|',
              `| TelemetryErrorHandler  | \`error.unhandled\`        | ${raw.includes('error_name=TypeError') ? '✅' : '❓'} |`,
              `| RouterTelemetryService | \`route.navigation_ms\`    | ${raw.includes('route.navigation_ms') ? '✅' : '❓'} |`,
              `| dispatchMonitorEnhancer| \`redux.dispatch\`         | ${raw.includes('redux.dispatch') ? '✅' : '❓'} |`,
              `| WebVitalsService       | \`web_vitals.lcp/fcp/…\`  | ${raw.includes('web_vitals.lcp') ? '✅' : '❓'} |`,
              `| Ring-buffer cap        | 500-event ceiling         | ${bufLine ? '✅ ' + bufLine : '❓'} |`,
              `| flush() sendBeacon     | NDJSON payload            | ${flushOk ? '✅ buffer cleared' : '❓'} |`,
              '',
              '### Performance API marks/measures',
              '',
              `\`${marksLine}\` · \`${measuresLine}\` (one measure per timing event)`,
              '',
              '### Console output (meaningful lines only)',
              '',
              meaningful || '(none captured)',
              '',
              '<details><summary>Full raw output</summary>',
              '',
              '```',
              raw.slice(0, 8000).trim(), // cap to avoid oversized summaries
              '```',
              '</details>',
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            console.log('Summary written to $GITHUB_STEP_SUMMARY');
          JS
