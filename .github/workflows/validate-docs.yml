name: Validate Architecture Diagrams

on:
  push:
    paths:
      - "docs/architecture.md"
      - "scripts/validate-diagrams.mjs"
      - ".github/workflows/validate-docs.yml"
  pull_request:
    paths:
      - "docs/architecture.md"
      - "scripts/validate-diagrams.mjs"
      - ".github/workflows/validate-docs.yml"

# Minimal permissions: diagram validation is read-only. No repo writes needed.
permissions:
  contents: read

jobs:
  validate-diagrams:
    name: Mermaid diagram validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium dependencies (required by Puppeteer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Validate Mermaid diagrams in docs/architecture.md
        id: validate
        run: |
          npm run validate:docs 2>&1 | tee validate-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post diagram validation summary
        if: always()
        continue-on-error: true   # advisory — summary failure must not fail diagram validation
        run: |
          node - << 'JS'
            const fs  = require('fs');
            const raw = fs.existsSync('validate-output.txt')
              ? fs.readFileSync('validate-output.txt', 'utf8') : '(no output)';
            const ok  = !raw.toLowerCase().includes('error') && raw.trim().length > 0;
            const icon = ok ? '✅' : '❌';

            const summary = [
              `## ${icon} Mermaid diagram validation`,
              '',
              `| Result | Diagrams in docs/architecture.md |`,
              `|---|---|`,
              `| ${ok ? 'All rendered successfully' : 'One or more failed'} | 3 |`,
              '',
              '<details><summary>Raw validate:docs output</summary>',
              '',
              '```',
              raw.trim(),
              '```',
              '</details>',
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          JS
