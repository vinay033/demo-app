name: Validate Architecture Diagrams

on:
  push:
    paths:
      - "docs/architecture.md"
      - "scripts/validate-diagrams.mjs"
      - ".github/workflows/validate-docs.yml"
  pull_request:
    paths:
      - "docs/architecture.md"
      - "scripts/validate-diagrams.mjs"
      - ".github/workflows/validate-docs.yml"

# Minimal permissions: diagram validation is read-only. No repo writes needed.
permissions:
  contents: read

# Cancel redundant validation runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-diagrams:
    name: Mermaid diagram validation
    runs-on: ubuntu-latest
    timeout-minutes: 15   # Puppeteer/Chromium launch can be slow; cap before it hangs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Cache Puppeteer Chromium download
        # RELIABILITY: Puppeteer downloads ~120 MB of Chromium during npm ci's postinstall.
        # Caching ~/.cache/puppeteer keyed on the lockfile saves ~35 s per run and
        # prevents failures when the Chromium download CDN is slow or rate-limited.
        # Cache is invalidated automatically when package-lock.json changes (new Puppeteer version).
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        # Retry up to 3 times — npm ci fails transiently on mirror/network timeouts
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed — retrying in 15s..." && sleep 15
          done

      - name: Install Chromium dependencies (required by Puppeteer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Validate Mermaid diagrams in docs/architecture.md
        id: validate
        run: |
          npm run validate:docs 2>&1 | tee validate-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post diagram validation summary
        if: always()
        continue-on-error: true   # advisory — summary failure must not fail diagram validation
        run: |
          node - << 'JS'
            const fs  = require('fs');
            const raw = fs.existsSync('validate-output.txt')
              ? fs.readFileSync('validate-output.txt', 'utf8') : '(no output)';
            const ok  = !raw.toLowerCase().includes('error') && raw.trim().length > 0;
            const icon = ok ? '✅' : '❌';

            const summary = [
              `## ${icon} Mermaid diagram validation`,
              '',
              `| Result | Diagrams in docs/architecture.md |`,
              `|---|---|`,
              `| ${ok ? 'All rendered successfully' : 'One or more failed'} | 3 |`,
              '',
              '<details><summary>Raw validate:docs output</summary>',
              '',
              '```',
              raw.trim(),
              '```',
              '</details>',
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          JS
