name: Validate Architecture Diagrams

on:
  push:
    paths:
      - "docs/architecture.md"
      - "scripts/validate-diagrams.mjs"
      - ".github/workflows/validate-docs.yml"
  pull_request:
    paths:
      - "docs/architecture.md"
      - "scripts/validate-diagrams.mjs"
      - ".github/workflows/validate-docs.yml"

jobs:
  validate-diagrams:
    name: Mermaid diagram validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium dependencies (required by Puppeteer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Validate Mermaid diagrams in docs/architecture.md
        run: npm run validate:docs
